<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Details – ScholarConnect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .details-page { margin-top: 70px; padding: 3rem 0; min-height: 100vh; }
    .details-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2.5rem; align-items: start; }
    .detail-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); padding: 2rem; box-shadow: var(--shadow-card); margin-bottom: 1.5rem; }
    .detail-card h3 { color: var(--text-primary); margin-bottom: 1rem; padding-bottom: .75rem; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: .6rem; }
    .doc-list { display: flex; flex-wrap: wrap; gap: .6rem; }
    .doc-tag { background: var(--info-light); color: var(--info); padding: .4rem .9rem; border-radius: 100px; font-size: .82rem; font-weight: 600; }
    .info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: .75rem 0; border-bottom: 1px solid var(--border-light); gap: 1rem; }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: .82rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
    .info-value { font-size: .9rem; color: var(--text-primary); font-weight: 600; text-align: right; }
    .sticky-sidebar { position: sticky; top: 90px; }
    .sidebar-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); padding: 1.75rem; box-shadow: var(--shadow-card); margin-bottom: 1.25rem; }
    .urgency-bar { background: var(--danger-light); border: 1px solid #fca5a5; border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.25rem; text-align: center; }
    .process-steps { counter-reset: step-counter; }
    .process-step { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; flex-shrink: 0; margin-top: .1rem; }
    .breadcrumb { display: flex; align-items: center; gap: .5rem; font-size: .82rem; color: var(--text-muted); margin-bottom: 1.5rem; flex-wrap: wrap; }
    .breadcrumb a { color: var(--primary); }
    .breadcrumb span { color: var(--text-muted); }
    @media(max-width: 900px){ .details-layout { grid-template-columns: 1fr; } .sticky-sidebar { position: static; } }
  </style>
</head>
<body>
<div id="page-loader" class="page-loader"><div class="loader-spinner"></div></div>
<div id="nav-overlay" class="nav-overlay"></div>

<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><div class="logo-title">ScholarConnect</div><div class="logo-sub">Scholarship Portal</div></div>
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/pages/scholarships.html" class="active">Scholarships</a></li>
        <li><a href="/pages/eligibility.html">Eligibility Checker</a></li>
        <li><a href="/pages/documents.html">Documents Guide</a></li>
        <li><a href="/pages/notifications.html">Notifications</a></li>
        <li><a href="/pages/about.html">About</a></li>
        <li><a href="/pages/contact.html">Contact</a></li>
        <li id="nav-admin-link" class="hidden"><a href="/pages/admin.html">⚙️ Admin</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
        <a href="/pages/login.html" id="nav-login-btn" class="btn btn-primary btn-sm">Login</a>
        <div id="nav-user-menu" class="hidden" style="display:flex;align-items:center;gap:.75rem">
          <a href="/pages/dashboard.html" class="btn btn-outline btn-sm">👤 <span id="nav-user-name">User</span></a>
          <button onclick="logout()" class="btn btn-sm" style="background:var(--danger-light);color:var(--danger)">Logout</button>
        </div>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </div>
</nav>

<div class="details-page">
  <div class="container">
    <div class="breadcrumb">
      <a href="/">Home</a> <span>›</span>
      <a href="/pages/scholarships.html">Scholarships</a> <span>›</span>
      <span id="breadcrumb-name">Loading…</span>
    </div>

    <div id="details-content">
      <!-- Skeleton -->
      <div class="details-layout">
        <div>
          <div class="skeleton" style="height:220px;border-radius:var(--radius);margin-bottom:1.5rem"></div>
          <div class="skeleton" style="height:180px;border-radius:var(--radius);margin-bottom:1.5rem"></div>
          <div class="skeleton" style="height:160px;border-radius:var(--radius)"></div>
        </div>
        <div>
          <div class="skeleton" style="height:320px;border-radius:var(--radius)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer" style="margin-top:4rem">
  <div class="container">
    <div class="footer-bottom">
      <div>© 2025 ScholarConnect</div>
      <div><a href="/">Home</a> · <a href="/pages/scholarships.html">Scholarships</a></div>
    </div>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location = '/pages/scholarships.html'; return; }

  try {
    const data = await API.get(`/scholarships/${id}`, false);
    const s = data.scholarship;
    document.title = `${s.name} – ScholarConnect`;
    document.getElementById('breadcrumb-name').textContent = s.name;

    const days    = Math.max(0, Math.ceil((new Date(s.deadline) - new Date()) / 86400000));
    const expired = days === 0;
    const urgent  = days <= 14 && !expired;

    const catBadges = (s.category||[]).map(c =>
      `<span class="badge ${getCategoryBadge(c)}">${c}</span>`).join('');

    const docTags = (s.documents||[]).map(d => `<span class="doc-tag">📄 ${d}</span>`).join('');

    const steps = (s.applicationProcess||'').split('\n').filter(Boolean).map((step,i)=>`
      <div class="process-step">
        <div class="step-num">${i+1}</div>
        <div style="font-size:.9rem;color:var(--text-secondary);padding-top:.15rem">${step.replace(/^\d+\.\s*/,'')}</div>
      </div>`).join('');

    const savedUser = Auth.getUser();
    const isSaved = savedUser?.savedScholarships?.includes(s._id);

    document.getElementById('details-content').innerHTML = `
    <div class="details-layout">
      <!-- MAIN -->
      <div>
        <!-- Hero Card -->
        <div class="detail-card" style="background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:none">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
            <div>
              <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem">${catBadges}
                ${s.gender !== 'All' ? `<span class="badge badge-info">👤 ${s.gender}</span>` : ''}
                ${expired ? '<span class="badge badge-expired">Expired</span>' : urgent ? `<span class="badge badge-urgent">⚡ Urgent</span>` : '<span class="badge badge-active">✅ Active</span>'}
              </div>
              <h2 style="color:#fff;font-size:1.6rem;margin-bottom:.75rem">${s.name}</h2>
              <p style="color:rgba(255,255,255,.8);max-width:600px">${s.description}</p>
            </div>
            <div style="text-align:right">
              <div style="font-size:2.2rem;font-weight:700;color:#fff">₹${s.amount.toLocaleString('en-IN')}</div>
              <div style="color:rgba(255,255,255,.7);font-size:.85rem">per annum</div>
            </div>
          </div>
        </div>

        <!-- Eligibility -->
        <div class="detail-card">
          <h3>✅ Eligibility Criteria</h3>
          <p style="color:var(--text-secondary);font-size:.95rem;line-height:1.7;margin-bottom:1rem">${s.eligibility}</p>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem">
            <div class="info-row" style="flex-direction:column;align-items:flex-start;background:var(--bg);padding:.85rem;border-radius:var(--radius-sm);border:none">
              <span class="info-label">Class Range</span>
              <span class="info-value" style="text-align:left">${s.eligibilityCriteria?.minClass||1} – ${s.eligibilityCriteria?.maxClass||12}</span>
            </div>
            <div class="info-row" style="flex-direction:column;align-items:flex-start;background:var(--bg);padding:.85rem;border-radius:var(--radius-sm);border:none">
              <span class="info-label">Min. Marks</span>
              <span class="info-value" style="text-align:left">${s.eligibilityCriteria?.minPercentage||0}%</span>
            </div>
            <div class="info-row" style="flex-direction:column;align-items:flex-start;background:var(--bg);padding:.85rem;border-radius:var(--radius-sm);border:none">
              <span class="info-label">Income Limit</span>
              <span class="info-value" style="text-align:left">₹${(s.incomeLimit||0).toLocaleString('en-IN')}</span>
            </div>
            <div class="info-row" style="flex-direction:column;align-items:flex-start;background:var(--bg);padding:.85rem;border-radius:var(--radius-sm);border:none">
              <span class="info-label">Gender</span>
              <span class="info-value" style="text-align:left">${s.gender}</span>
            </div>
          </div>
        </div>

        <!-- Benefits -->
        <div class="detail-card">
          <h3>🎁 Benefits & Amount</h3>
          <p style="color:var(--text-secondary);font-size:.95rem;line-height:1.7">${s.benefits || s.amountDescription || `₹${s.amount.toLocaleString('en-IN')} per annum`}</p>
        </div>

        <!-- Documents -->
        <div class="detail-card">
          <h3>📋 Required Documents</h3>
          <div class="doc-list">${docTags || '<p style="color:var(--text-muted)">Contact official portal for documents list.</p>'}</div>
          <div style="margin-top:1rem;padding:1rem;background:var(--info-light);border-radius:var(--radius-sm);font-size:.85rem;color:var(--info)">
            💡 <strong>Tip:</strong> Keep all documents ready in both original and photocopies before applying. <a href="/pages/documents.html" style="color:var(--primary);font-weight:600">View Documents Guide →</a>
          </div>
        </div>

        <!-- Application Process -->
        ${s.applicationProcess ? `
        <div class="detail-card">
          <h3>📝 How to Apply</h3>
          <div class="process-steps">${steps}</div>
        </div>` : ''}
      </div>

      <!-- SIDEBAR -->
      <div class="sticky-sidebar">
        ${urgent && !expired ? `
        <div class="urgency-bar">
          <div style="font-weight:700;color:var(--danger);margin-bottom:.3rem">⚠️ Deadline Approaching!</div>
          <div style="font-size:.85rem;color:#991b1b">Only <strong>${days} days</strong> left to apply</div>
        </div>` : ''}

        <!-- Quick Info -->
        <div class="sidebar-card">
          <h3 style="font-size:1rem;margin-bottom:1rem;color:var(--text-primary)">📌 Quick Info</h3>
          <div class="info-row"><span class="info-label">Deadline</span><span class="info-value ${urgent?'text-danger':''}">${formatDate(s.deadline)}</span></div>
          <div class="info-row"><span class="info-label">Amount</span><span class="info-value text-success">₹${s.amount.toLocaleString('en-IN')}</span></div>
          <div class="info-row"><span class="info-label">State</span><span class="info-value">${(s.state||['All India']).join(', ')}</span></div>
          <div class="info-row"><span class="info-label">Category</span><span class="info-value">${(s.category||[]).join(', ')}</span></div>
          <div class="info-row"><span class="info-label">👁️ Views</span><span class="info-value">${(s.views||0).toLocaleString()}</span></div>
          <div class="info-row" style="border:none"><span class="info-label">👥 Applied</span><span class="info-value">${(s.applicants||0).toLocaleString()}</span></div>
        </div>

        <!-- Countdown -->
        ${!expired ? `
        <div class="sidebar-card">
          <h3 style="font-size:1rem;margin-bottom:1rem;color:var(--text-primary)">⏰ Deadline Countdown</h3>
          <div id="countdown-timer"></div>
        </div>` : ''}

        <!-- Actions -->
        <div class="sidebar-card">
          <a href="${s.officialLink||'#'}" target="_blank" rel="noopener" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-bottom:.75rem">
            🚀 Apply Now ↗
          </a>
          ${Auth.isLoggedIn() ? `
          <button id="save-btn" onclick="toggleSave('${s._id}')" class="btn btn-outline w-full" style="justify-content:center;margin-bottom:.75rem">
            ${isSaved ? '🔖 Saved' : '🏷️ Save Scholarship'}
          </button>
          <button onclick="markApplied('${s._id}')" class="btn w-full" style="justify-content:center;background:var(--success-light);color:var(--success)">
            ✅ Mark as Applied
          </button>` : `
          <a href="/pages/login.html" class="btn btn-outline w-full" style="justify-content:center">
            🔐 Login to Save
          </a>`}
        </div>

        <!-- Check Eligibility -->
        <div class="sidebar-card" style="background:linear-gradient(135deg,#eff3fc,#e0e8f8);border-color:rgba(26,60,124,.15)">
          <div style="font-size:1.3rem;margin-bottom:.5rem">🎯</div>
          <h3 style="font-size:1rem;margin-bottom:.5rem;color:var(--primary)">Check Your Eligibility</h3>
          <p style="font-size:.82rem;color:var(--text-secondary);margin-bottom:1rem">Find out instantly if you qualify for this scholarship</p>
          <a href="/pages/eligibility.html" class="btn btn-primary w-full" style="justify-content:center">Check Eligibility</a>
        </div>
      </div>
    </div>`;

    // Start countdown
    if (!expired) renderCountdown(s.deadline, 'countdown-timer');

  } catch(err) {
    document.getElementById('details-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h3>Scholarship not found</h3>
        <p>${err.message}</p>
        <a href="/pages/scholarships.html" class="btn btn-primary mt-2">Back to Scholarships</a>
      </div>`;
  }
});

async function toggleSave(id) {
  try {
    const data = await API.post(`/scholarships/${id}/save`);
    const btn = document.getElementById('save-btn');
    btn.textContent = data.saved ? '🔖 Saved' : '🏷️ Save Scholarship';
    btn.className = `btn ${data.saved ? 'btn-primary' : 'btn-outline'} w-full`;
    showToast(data.message, 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function markApplied(id) {
  try {
    const data = await API.post(`/users/apply/${id}`);
    showToast(data.message, 'success');
  } catch(e) { showToast(e.message, 'error'); }
}
</script>
</body>
</html>
